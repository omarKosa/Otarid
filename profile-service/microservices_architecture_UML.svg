<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- CLIENT -->
<g class="c-gray">
  <rect x="270" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Client / Browser</text>
</g>

<!-- Arrow down to gateway -->
<line x1="340" y1="64" x2="340" y2="108" class="arr" marker-end="url(#arrow)" stroke-width="1.2"/>
<text class="ts" x="355" y="90" fill="var(--color-text-secondary)">HTTPS</text>

<!-- API GATEWAY -->
<g class="c-purple">
  <rect x="210" y="108" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">API Gateway</text>
  <text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">Routes · Auth check · Rate limit</text>
</g>

<!-- Arrows from gateway to 3 services -->
<!-- to auth -->
<line x1="250" y1="164" x2="140" y2="230" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<!-- to profile -->
<line x1="340" y1="164" x2="340" y2="230" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<!-- label REST -->
<text class="ts" x="355" y="205" fill="var(--color-text-secondary)">REST</text>

<!-- AUTH SERVICE -->
<g class="c-teal">
  <rect x="40" y="230" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="252" text-anchor="middle" dominant-baseline="central">Auth Service</text>
  <text class="ts" x="130" y="270" text-anchor="middle" dominant-baseline="central">JWT · Login · Register</text>
</g>

<!-- PROFILE SERVICE -->
<g class="c-blue">
  <rect x="250" y="230" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">Profile Service</text>
  <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">CRUD · Avatar · Password</text>
</g>

<!-- Arrow auth → profile (sync verify token) -->
<line x1="220" y1="252" x2="250" y2="252" class="arr" marker-end="url(#arrow)" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="235" y="246" text-anchor="middle" fill="var(--color-text-secondary)">verify</text>

<!-- AUTH DB -->
<g class="c-teal">
  <rect x="40" y="330" width="180" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="350" text-anchor="middle" dominant-baseline="central">Auth DB (Postgres)</text>
</g>
<line x1="130" y1="286" x2="130" y2="330" class="arr" marker-end="url(#arrow)" stroke-width="0.8"/>

<!-- PROFILE DB -->
<g class="c-blue">
  <rect x="250" y="330" width="180" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">Profile DB (Postgres)</text>
</g>
<line x1="340" y1="286" x2="340" y2="330" class="arr" marker-end="url(#arrow)" stroke-width="0.8"/>

<!-- RABBITMQ -->
<g class="c-amber">
  <rect x="250" y="420" width="180" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="437" text-anchor="middle" dominant-baseline="central">RabbitMQ</text>
  <text class="ts" x="340" y="453" text-anchor="middle" dominant-baseline="central">Event bus (async)</text>
</g>

<!-- Profile → RabbitMQ -->
<line x1="340" y1="370" x2="340" y2="420" class="arr" marker-end="url(#arrow)" stroke="#EF9F27" stroke-width="1"/>
<text class="ts" x="355" y="400" fill="var(--color-text-secondary)">publish</text>

<!-- Auth → RabbitMQ -->
<path d="M130 370 Q130 395 250 440" fill="none" stroke="#EF9F27" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<!-- NOTIFICATION SERVICE -->
<g class="c-coral">
  <rect x="460" y="420" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="550" y="442" text-anchor="middle" dominant-baseline="central">Notification Service</text>
  <text class="ts" x="550" y="460" text-anchor="middle" dominant-baseline="central">Email · Logs · Alerts</text>
</g>

<!-- RabbitMQ → Notification -->
<line x1="430" y1="442" x2="460" y2="442" class="arr" marker-end="url(#arrow)" stroke="#EF9F27" stroke-width="1"/>
<text class="ts" x="445" y="435" text-anchor="middle" fill="var(--color-text-secondary)">consume</text>

<!-- Gateway also points to notification directly (no direct arrow, gateway doesn't know notif exists) -->

<!-- Legend -->
<rect x="40" y="510" width="600" height="52" rx="6" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="56" y="530" fill="var(--color-text-secondary)">Legend:</text>
<line x1="110" y1="528" x2="145" y2="528" stroke="var(--color-text-primary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="532" fill="var(--color-text-secondary)">REST (sync)</text>
<line x1="255" y1="528" x2="290" y2="528" stroke="#EF9F27" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="295" y="532" fill="var(--color-text-secondary)">Async event (RabbitMQ)</text>
<line x1="455" y1="528" x2="490" y2="528" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="495" y="532" fill="var(--color-text-secondary)">Service-to-service REST</text>

<text class="ts" x="56" y="554" fill="var(--color-text-secondary)">Each service has its own database (no shared DB).</text>
</svg>