services:

  # ─── DATABASES ────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-db:
    image: postgres:16-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MESSAGE BROKER ───────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SERVICES ─────────────────────────────────────────────────

  profile-service:
    build: ./profile-service
    container_name: profile-service
    env_file: ./profile-service/.env
    environment:
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:5001
      INTERNAL_API_KEY: otarid_internal_dev_key
      CLIENT_URL: http://localhost:3001
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      profile-db:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  auth-service:
    build: ./authentication-service
    container_name: auth-service
    env_file: ./authentication-service/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PROFILE_SERVICE_URL: http://profile-service:5002
      INTERNAL_API_KEY: otarid_internal_dev_key
      CLIENT_URL: http://localhost:3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5001:5001"
    depends_on:
      auth-db:
        condition: service_healthy
      profile-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    env_file: ./notification-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5003:5003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file: ./api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      PROFILE_SERVICE_URL: http://profile-service:5002
      CLIENT_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - profile-service
    networks:
      - internal
    restart: on-failure

  frontend:
    image: node:20-alpine
    container_name: otarid-frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      WDS_SOCKET_PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://localhost:3000/api
      REACT_APP_GATEWAY_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./otarid-frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api-gateway
    networks:
      - internal
    restart: on-failure

# ─── VOLUMES ────────────────────────────────────────────────────

volumes:
  auth-db-data:
  profile-db-data:
  rabbitmq-data:
  frontend-node-modules:


# ─── NETWORKS ───────────────────────────────────────────────────

networks:
  internal:
    driver: bridge
