services:

  # ─── DATABASES ────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-db:
    image: postgres:16-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MESSAGE BROKER ───────────────────────────────────────────

  # RabbitMQ is provided by an external container already bound on host port 5672.
  # Services will connect to it through host.docker.internal.

  # ─── SERVICES ─────────────────────────────────────────────────

  profile-service:
    build: ./profile-service
    container_name: profile-service
    env_file: ./profile-service/.env
    environment:
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:5001
      INTERNAL_API_KEY: otarid_internal_dev_key
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      profile-db:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  auth-service:
    build: ./authentication-service
    container_name: auth-service
    env_file: ./authentication-service/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PROFILE_SERVICE_URL: http://profile-service:5002
      INTERNAL_API_KEY: otarid_internal_dev_key
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
    ports:
      - "5001:5001"
    depends_on:
      auth-db:
        condition: service_healthy
      profile-service:
        condition: service_started
    networks:
      - internal
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    env_file: ./notification-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
    ports:
      - "5003:5003"
    networks:
      - internal
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file: ./api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      PROFILE_SERVICE_URL: http://profile-service:5002
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - profile-service
    networks:
      - internal
    restart: on-failure

# ─── VOLUMES ────────────────────────────────────────────────────

volumes:
  auth-db-data:
  profile-db-data:


# ─── NETWORKS ───────────────────────────────────────────────────

networks:
  internal:
    driver: bridge
