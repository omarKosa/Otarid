version: "3.9"

services:

  # ─── DATABASES ────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-db:
    image: postgres:16-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"      # different host port so they don't clash
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MESSAGE BROKER ───────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP (services connect here)
      - "15672:15672"    # Management UI → http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── SERVICES ─────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: auth-service
    env_file: ./auth-service/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5001:5001"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  profile-service:
    build: ./profile-service
    container_name: profile-service
    env_file: ./profile-service/.env
    environment:
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "5002:5002"
    depends_on:
      profile-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - internal
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    env_file: ./notification-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5003:5003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file: ./api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      PROFILE_SERVICE_URL: http://profile-service:5002
    ports:
      - "3000:3000"      # ← this is the only port you call from outside
    depends_on:
      - auth-service
      - profile-service
    networks:
      - internal
    restart: on-failure

# ─── VOLUMES ────────────────────────────────────────────────────

volumes:
  auth-db-data:
  profile-db-data:
  rabbitmq-data:

# ─── NETWORKS ───────────────────────────────────────────────────

networks:
  internal:
    driver: bridge